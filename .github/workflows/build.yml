name: Build patched OmniRoute

# Daily: find the newest upstream release, and if ghcr.io/<owner>/omniroute:<ver>-jev<rev> does not
# exist yet, apply patches/, run the plugin tests, build the amd64 runner-web image and push it
# with provenance + SBOM. A patch that no longer applies opens an issue and stops; the previous
# image stays live. A patch that upstream already contains is dropped automatically.
#
# Image tags are immutable (safety audit F11, 2026-11-09): this workflow never pushes over an
# existing <ver>-jev<rev>, so a tag's provenance cannot be silently replaced. A rebuild therefore
# needs a new JEV_REV, which makes a new tag; there is no force input. A run that finds its tag
# already published records that tag's digest in the step summary and changes nothing. If the
# registry cannot say whether the tag exists, the run stops instead of building over it.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (default: newest stable release)"
        required: false
        type: string
  push:
    branches: [master]
    paths: ["patches/**", "JEV_REV", "scripts/**", ".github/workflows/build.yml"]

concurrency:
  group: build-patched-omniroute
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omniroute

jobs:
  build:
    runs-on: ubuntu-24.04   # 16 GB RAM; upstream's own web build needs ~12 GB of heap
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      issues: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve upstream tag and image tag
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(scripts/latest-upstream-tag.sh)}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag: $tag" >&2; exit 1;; esac
          rev="$(cat JEV_REV)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag#v}-jev$rev" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when this image tag already exists (tags are immutable)
        id: exists
        run: |
          ref="$IMAGE:${{ steps.ver.outputs.image_tag }}"
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            digest="$(printf '%s\n' "$out" | awk '/^Digest:/{print $2; exit}')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$ref already exists at ${digest:-unknown digest}; not rebuilding it"
            {
              echo "### $ref already exists — nothing was rebuilt"
              echo "previous digest: \`${digest:-unknown}\` (tag unchanged)"
              echo "Tags are immutable: bump \`JEV_REV\` and push to publish a new tag."
            } >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s\n' "$out" | grep -qiE 'not found|manifest unknown|name_unknown'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$ref does not exist yet; building it"
          else
            echo "could not tell whether $ref exists; refusing to build over an unknown tag:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          node-version: 26

      - name: Clone upstream, apply patches, test
        id: prep
        if: steps.exists.outputs.skip != 'true'
        run: |
          set +e
          git clone --depth 1 --branch "${{ steps.ver.outputs.tag }}" https://github.com/diegosouzapw/OmniRoute.git upstream || exit 1
          scripts/apply-patches.sh upstream patches; rc=$?
          if [ $rc -eq 3 ]; then echo "conflict=true" >> "$GITHUB_OUTPUT"; exit 1; fi
          [ $rc -eq 0 ] || exit $rc
          set -e
          cd upstream
          npm ci --no-audit --no-fund
          DISABLE_SQLITE_AUTO_BACKUP=true node --max-old-space-size=8192 --import tsx/esm \
            --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts \
            --test --test-force-exit --test-concurrency=4 tests/unit/plugins-*.test.ts

      - name: Open an issue when a patch no longer applies
        if: failure() && steps.prep.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Patch does not apply to upstream ${{ steps.ver.outputs.tag }}"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" \
              --body "The nightly build could not apply \`patches/\` to upstream ${{ steps.ver.outputs.tag }}. The previous image stays live. Run: scripts/build-image.sh ${{ steps.ver.outputs.tag }} locally, rebase the patch, bump JEV_REV. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Build and push (amd64, runner-web)
        id: push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          target: runner-web
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.image_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OmniRoute ${{ steps.ver.outputs.tag }} + jev-router onRoute patch
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          push: true
          cache-from: type=gha,scope=omniroute-jev
          cache-to: type=gha,scope=omniroute-jev,mode=max,ignore-error=true

      - uses: actions/attest-build-provenance@v2
        if: steps.exists.outputs.skip != 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: steps.exists.outputs.skip != 'true'
        run: |
          {
            echo "### ${{ env.IMAGE }}:${{ steps.ver.outputs.image_tag }}"
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
            echo "pin it: \`image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Audit 2026-11-09: the v3.8.53 CI break stayed red ~4 days with no page. Any failure now
      # pages Telegram when the repo secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID exist (owner adds
      # them; without them this step is skipped). A green build closes the stale patch-conflict
      # issue for the tag it just built, so fixed breaks do not stay open.
      - name: Page on failure
        if: failure()
        env:
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
        run: |
          [ -n "$TG_BOT" ] || { echo "no Telegram secret; skipping page"; exit 0; }
          text="jev-router build FAILED for $IMAGE_TAG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$TG_BOT" |
            curl -sS -m 10 -K - -o /dev/null -w '%{http_code}\n' --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" --data-urlencode "disable_web_page_preview=true"

      - name: Close fixed patch issues on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          for n in $(gh issue list --state open --search "Patch does not apply to upstream $UPSTREAM_TAG in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded: upstream $UPSTREAM_TAG built green in run ${{ github.run_id }}."
          done
